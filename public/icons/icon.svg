<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#172336" />
      <stop offset="100%" stop-color="#0b1018" />
    </radialGradient>
    <linearGradient id="turbine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="plasma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cockpit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Energy binder between twin turbines -->
  <path
    d="M 180 170 Q 256 142 332 170"
    fill="none"
    stroke="url(#plasma)"
    stroke-width="14"
    stroke-linecap="round"
    opacity="0.95"
  />
  <path
    d="M 180 170 Q 256 196 332 170"
    fill="none"
    stroke="#38bdf8"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- Control cables -->
  <line x1="158" y1="278" x2="232" y2="342" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  <line x1="354" y1="278" x2="280" y2="342" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />

  <!-- Left turbine -->
  <rect x="112" y="102" width="72" height="190" rx="34" fill="url(#turbine)" />
  <rect x="128" y="88" width="40" height="28" rx="12" fill="#38bdf8" />
  <rect x="126" y="294" width="44" height="36" rx="14" fill="#38bdf8" opacity="0.85" />

  <!-- Right turbine -->
  <rect x="328" y="102" width="72" height="190" rx="34" fill="url(#turbine)" />
  <rect x="344" y="88" width="40" height="28" rx="12" fill="#38bdf8" />
  <rect x="342" y="294" width="44" height="36" rx="14" fill="#38bdf8" opacity="0.85" />

  <!-- Cockpit pod -->
  <path
    d="M 256 306 L 304 374 L 284 426 L 228 426 L 208 374 Z"
    fill="url(#cockpit)"
  />
  <ellipse cx="256" cy="364" rx="22" ry="26" fill="#0ea5e9" />
  <ellipse cx="256" cy="358" rx="11" ry="12" fill="#bae6fd" opacity="0.85" />
</svg>
